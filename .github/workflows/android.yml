name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Inspect APK manifest
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='pl.mojealterego.royaltruth'" apk-badging.txt
          grep -q "application-label:'Experience of Royal Truth'" apk-badging.txt
      - name: Verify APK archive integrity
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" >/dev/null
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prawda-czy-wyzwanie-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
